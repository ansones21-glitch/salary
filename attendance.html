<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>上下班打卡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <nav class="nav" aria-label="主選單">
      <a href="index.html">首頁</a>
      <a href="attendance.html" aria-current="page">上下班打卡</a>
      <a href="late.html">遲到</a>
      <a href="overtime.html">加班</a>
    </nav>

    <header class="header">
      <h1>上下班打卡</h1>
    </header>

    <section class="card" aria-labelledby="records-title">
      <h2 id="records-title">打卡紀錄</h2>
      <p id="summary" class="muted"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>日期</th>
              <th>上班</th>
              <th>下班</th>
              <th>遲到</th>
              <th>加班</th>
            </tr>
          </thead>
          <tbody id="records"></tbody>
        </table>
      </div>
      <p id="message" class="muted empty" role="status">載入中…</p>
    </section>
  </main>

  <script>
    // Supabase 連線設定：到 Supabase 專案的 Project Settings → API 複製
    var SUPABASE_URL = 'https://你的專案代碼.supabase.co';
    var SUPABASE_ANON_KEY = '你的 anon public key';

    var WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];
    var TIME_FORMAT = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Taipei',
      hour: '2-digit',
      minute: '2-digit',
      hourCycle: 'h23'
    });

    function $(id) { return document.getElementById(id); }

    function showMessage(text, isError) {
      var el = $('message');
      el.textContent = text;
      el.className = 'empty ' + (isError ? 'error' : 'muted');
      el.hidden = !text;
    }

    // work_date 例如 "2026-11-05" → "11/05 週四"（手機版隱藏星期）
    function dateHtml(workDate) {
      var p = workDate.split('-');
      var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
      return p[1] + '/' + p[2] + '<span class="wd"> 週' + WEEKDAYS[d.getDay()] + '</span>';
    }

    // timestamptz 轉成台北時間 "HH:MM"
    function timeText(iso) {
      return iso ? TIME_FORMAT.format(new Date(iso)) : '—';
    }

    function render(rows) {
      var html = '';
      rows.forEach(function (r) {
        var late = r.late_minutes > 0;
        var ot = r.overtime_minutes > 0;
        html += '<tr>' +
          '<td>' + dateHtml(r.work_date) + '</td>' +
          '<td>' + timeText(r.clock_in_at) + '</td>' +
          '<td>' + timeText(r.clock_out_at) + '</td>' +
          '<td' + (late ? ' class="late"' : '') + '>' + (late ? r.late_minutes + ' 分' : '—') + '</td>' +
          '<td' + (ot ? ' class="overtime"' : '') + '>' + (ot ? (r.overtime_minutes / 60).toFixed(1) + ' 小時' : '—') + '</td>' +
          '</tr>';
      });
      $('records').innerHTML = html;
      $('summary').textContent = rows.length ? '共 ' + rows.length + ' 筆紀錄，最新的在最上面' : '';
      showMessage(rows.length ? '' : '目前沒有打卡紀錄');
    }

    function load() {
      if (SUPABASE_URL.indexOf('你的') !== -1 || SUPABASE_ANON_KEY.indexOf('你的') !== -1) {
        showMessage('尚未設定 Supabase 連線，請先修改程式碼最上方的 SUPABASE_URL 與 SUPABASE_ANON_KEY。', true);
        return;
      }
      var url = SUPABASE_URL + '/rest/v1/attendance' +
        '?select=work_date,clock_in_at,clock_out_at,late_minutes,overtime_minutes' +
        '&order=work_date.desc,clock_in_at.desc';
      fetch(url, {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: 'Bearer ' + SUPABASE_ANON_KEY
        }
      })
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(render)
        .catch(function (err) {
          showMessage('無法載入打卡紀錄（' + err.message + '），請確認連線設定與資料表權限。', true);
        });
    }

    load();
  </script>
</body>
</html>
